name: Docker Build

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'Dockerfile'
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/whisprx_api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/whisprx_api:latest
